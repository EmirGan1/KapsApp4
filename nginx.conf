# ==============================================================================
# KapsApp Production Nginx Configuration
# High-Performance Reverse Proxy, WebSocket & 300MB Media Upload Support
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ==============================================================================
    # 1. CLIENT UPLOAD LIMITS & TIMEOUTS (300MB Upload Guarantee)
    # ==============================================================================
    client_max_body_size 300M;
    client_body_buffer_size 16M;
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;

    # ==============================================================================
    # 2. GZIP COMPRESSION
    # ==============================================================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ==============================================================================
    # 3. UPSTREAM BACKEND SERVER (Node.js / Express on Port 3000)
    # ==============================================================================
    upstream kapsapp_backend {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name kapsapp.online www.kapsapp.online localhost;

        # Redirect HTTP to HTTPS in production
        # return 301 https://$host$request_uri;

        # ==========================================================================
        # 4. LARGE FILE UPLOAD SETTINGS & PROXY PASS
        # ==========================================================================
        client_max_body_size 300M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Static Uploads folder
        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri @backend_proxy;
        }

        # WebSocket Signaling & Real-Time Sync (Socket.io)
        location /socket.io/ {
            proxy_pass http://kapsapp_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # API Routes (Includes /api/upload and /api/upload-multiple with 300M limit)
        location /api/ {
            client_max_body_size 300M;
            proxy_pass http://kapsapp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # General Application Fallback
        location / {
            client_max_body_size 300M;
            proxy_pass http://kapsapp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location @backend_proxy {
            proxy_pass http://kapsapp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
