name: Dust bomb audit
on:
  push:
    branches: [fix/dust-short-audit]
  pull_request:
    paths:
      - 'src/games/kapsstrike/**'
      - 'src/server/kapsstrikeServer.ts'
      - 'tests/kapsstrike*'
      - '.github/workflows/dust-bomb-audit.yml'
permissions:
  contents: read
concurrency:
  group: dust-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: 1000 geometry and bomb scenarios
        run: npm run test:strike:audit
      - name: Existing bomb and route regressions
        run: node --import tsx --test tests/kapsstrike.bomb.test.ts tests/kapsstrike.bombWeapons.test.ts tests/kapsstrike.spawn.test.ts tests/kapsstrike.dust3d.test.ts tests/kapsstrike.multiplayer.test.ts tests/kapsstrike.controls.test.ts tests/kapsstrike.hitreg.test.ts
      - run: npm run build
