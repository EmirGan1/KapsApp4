name: Dust bomb audit
on:
  pull_request:
    paths:
      - 'src/games/kapsstrike/**'
      - 'src/components/games/kapsstrike/**'
      - 'src/server/kapsstrikeServer.ts'
      - 'tests/kapsstrike*'
      - '.github/workflows/dust-bomb-audit.yml'
permissions:
  contents: read
concurrency:
  group: dust-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (repository lockfile predates Babylon and Playwright)
        run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: 1000 geometry and bomb scenarios
        run: npm run test:strike:audit
      - name: Existing bomb and route regressions
        run: node --import tsx --test tests/kapsstrike.bomb.test.ts tests/kapsstrike.bombWeapons.test.ts tests/kapsstrike.spawn.test.ts tests/kapsstrike.dust3d.test.ts tests/kapsstrike.multiplayer.test.ts tests/kapsstrike.controls.test.ts tests/kapsstrike.hitreg.test.ts tests/kapsstrike.bombShortcuts.test.ts
      - name: 4v4 spawn, routes, halftime and spectator regressions
        run: npm run test:strike:4v4
      - name: Eight real network clients and A/B objectives
        run: npm run test:strike:4v4:network
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and touch bomb flow
        env:
          STRIKE_QA_COMPACT: '1'
        run: node --import tsx tests/kapsstrike.bomb.browser.ts
      - name: 4v4 desktop and touch spectator flow
        run: npm run test:strike:4v4:browser
      - name: Save map and bomb screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dust-bomb-screenshots-${{ github.event_name }}
          path: /tmp/strike-*.png
          if-no-files-found: ignore
