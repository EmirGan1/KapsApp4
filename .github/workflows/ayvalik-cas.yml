name: Ayvalik CAS
on:
  pull_request:
    paths:
      - 'src/components/Ayvalik*'
      - 'src/components/ayvalik/**'
      - 'src/utils/ayvalik.ts'
      - 'src/server/ayvalik*'
      - 'tests/ayvalik*'
      - '.github/workflows/ayvalik-cas.yml'
permissions:
  contents: read
concurrency:
  group: ayvalik-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:ayvalik
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ayvalik:browser
      - run: npm run test:ayvalik:companion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ayvalik-companion-previews
          path: /tmp/cas-companion-*.png
          if-no-files-found: ignore
