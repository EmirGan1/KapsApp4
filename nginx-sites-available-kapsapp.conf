# ==============================================================================
# Nginx Site Configuration (/etc/nginx/sites-available/kapsapp)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name kapsapp.online www.kapsapp.online;

    # Allow 300 MiB files plus multipart metadata and boundaries
    client_max_body_size 320M;
    client_body_buffer_size 16M;
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;

    # Timeouts for large file uploads and video streaming
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Socket.io WebSocket Support
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AI Detector Endpoints (tight body limit & zero access logging)
    location ^~ /api/ai-checker {
        client_max_body_size 128k;
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # API & Upload Endpoints
    location ^~ /api/ {

        # Keep detector request bodies in memory and out of detector access logs.
        location ~* ^/api/ai-checker/ {
            client_max_body_size 320k;
            client_body_buffer_size 320k;
            client_body_in_file_only off;
            proxy_pass http://127.0.0.1:3000;
            client_body_timeout 10s;
            proxy_request_buffering on;
            access_log off;
        }

        # Keep KapsAI streaming unbuffered with extended read timeout for CPU inference.
        location ~* ^/api/kapsapp-ai/ {
            client_max_body_size 96k;
            client_body_buffer_size 96k;
            client_body_in_file_only off;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            access_log off;
        }

        client_max_body_size 320M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Main Application
    location / {
        client_max_body_size 320M;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
